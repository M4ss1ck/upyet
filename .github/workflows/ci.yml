name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, compile, test, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Compiler and lint warnings fail the build (app/build.gradle.kts), so a green run here means zero
      # warnings. compileDebugAndroidTestKotlin is listed because nothing else compiles the instrumented
      # tests without a device, and their warnings count too.
      - name: Check
        run: ./gradlew spotlessCheck compileDebugAndroidTestKotlin test lint assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
